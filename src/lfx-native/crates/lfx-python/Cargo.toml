[package]
name = "lfx-python"
description = "The Python binding of lfx: the lfx-native package."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# The fixture runner in tests/ runs through Python; the crate has no Rust tests.
test = false
doctest = false

[dependencies]
lfx = { path = "../lfx" }
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[lints]
workspace = true
