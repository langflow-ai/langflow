[project]
name = "lfx-turbo-notify"
version = "1.5.13"
description = "Turbo Notify WhatsApp messaging components (send, reply, read, status, groups) as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "turbo-notify", "whatsapp", "messaging"]

# Runtime deps: lfx (the BUNDLE_API surface) plus httpx, which the components
# use to call the Turbo Notify REST API directly.  Turbo Notify needs no Python
# SDK, so httpx is the only third-party runtime dependency; it is already an
# lfx dependency and is listed here as a direct runtime dep because the
# components import it, keeping the bundle buildable if lfx drops it later.
dependencies = [
    "lfx>=1.14.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.langflow.org/extensions"
Repository = "https://github.com/langflow-ai/langflow"

# Manifest-shipping distributions are discovered via the
# ``langflow.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."langflow.extensions"]
lfx-turbo-notify = "lfx_turbo_notify"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the lfx_turbo_notify package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/lfx_turbo_notify"]
include = ["src/lfx_turbo_notify/extension.json", "src/lfx_turbo_notify/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_turbo_notify",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
