[project]
name = "lfx-crawlerdata"
version = "0.1.0"
description = "CrawlerData Google Search (SERP) component as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "CrawlerData", email = "contact@crawlerdata.com" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "crawlerdata", "search", "serp", "google"]

# Runtime deps: lfx (the BUNDLE_API surface) plus httpx, which the component
# uses to call the CrawlerData API directly.  CrawlerData ships no Python SDK
# requirement for this call, so httpx is the only third-party runtime dependency;
# it is already an lfx dependency and is listed here as a direct runtime dep
# because the component imports it, keeping the bundle buildable if lfx drops it.
# lfx is floored at the current major.minor line and capped below the next lfx
# major; the floor is re-synced on ``make patch`` via scripts/ci/sync_bundle_lfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# lfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "lfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.langflow.org/extensions"
Repository = "https://github.com/langflow-ai/langflow"

# Manifest-shipping distributions are discovered via the
# ``langflow.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."langflow.extensions"]
lfx-crawlerdata = "lfx_crawlerdata"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the lfx_crawlerdata package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/lfx_crawlerdata"]
include = ["src/lfx_crawlerdata/extension.json", "src/lfx_crawlerdata/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_crawlerdata",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
