[project]
name = "lfx-salesforce"
version = "0.1.0"
description = "Bounded Salesforce record actions and replication polling triggers."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = { text = "MIT" }
dependencies = ["lfx>=1.14.0.dev0,<2.0.0"]

[project.entry-points."langflow.extensions"]
lfx-salesforce = "lfx_salesforce"

[project.entry-points."langflow.trigger_providers"]
salesforce = "langflow.services.triggers.providers.salesforce:PROVIDER"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_salesforce"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
