[project]
name = "lfx-typesafe"
version = "0.1.0"
description = "TypeSafe System One components for Langflow, including the Jev classification model."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "typesafe", "systemone", "jev"]

# The System One HTTP API is called directly. The TypeSafe Python SDK is not
# required, and httpx is declared explicitly because the component imports it.
# lfx is floored at the current major.minor line and capped below the next
# lfx major; fine-grained BUNDLE_API compatibility is enforced via
# extension.json's lfx.compat list.
dependencies = [
    "lfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.typesafe.ai/api"
Repository = "https://github.com/langflow-ai/langflow"

[project.entry-points."langflow.extensions"]
lfx-typesafe = "lfx_typesafe"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_typesafe"]
include = [
    "src/lfx_typesafe/extension.json",
    "src/lfx_typesafe/components/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_typesafe",
    "README.md",
    "pyproject.toml",
]
