[project]
name = "lfx-asyntai"
version = "0.1.0"
description = "Asyntai AI Chatbot components (ask the chatbot, add knowledge, list leads) as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "asyntai", "chatbot", "knowledge-base", "leads"]

# Runtime deps: lfx (the BUNDLE_API surface) plus httpx, which the components
# use to call the Asyntai REST API directly.  Asyntai ships no Python SDK that
# the components need, so httpx is the only third-party runtime dependency; it
# is already an lfx dependency and is listed here as a direct runtime dep
# because the components import it.
dependencies = [
    "lfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.langflow.org/extensions"
Repository = "https://github.com/langflow-ai/langflow"

[project.entry-points."langflow.extensions"]
lfx-asyntai = "lfx_asyntai"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_asyntai"]
include = ["src/lfx_asyntai/extension.json", "src/lfx_asyntai/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_asyntai",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
