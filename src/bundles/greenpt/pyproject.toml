[project]
name = "lfx-greenpt"
version = "0.1.0"
description = "GreenPT models, embeddings, reranking, and speech-to-text as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "greenpt", "openai", "llm", "embeddings", "rerank"]
dependencies = [
    "httpx>=0.24,<1",
    "langchain-openai>=1.1.6",
    "lfx>=1.12.0.dev0,<2.0.0",
]

[project.urls]
Homepage = "https://greenpt.ai"
Documentation = "https://docs.greenpt.ai"
Repository = "https://github.com/langflow-ai/langflow"

[project.entry-points."langflow.extensions"]
lfx-greenpt = "lfx_greenpt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_greenpt"]
include = ["src/lfx_greenpt/extension.json", "src/lfx_greenpt/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_greenpt",
    "README.md",
    "pyproject.toml",
]
