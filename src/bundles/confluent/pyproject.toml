[project]
name = "lfx-confluent"
version = "0.1.0"
description = "IBM Confluent components (Kafka producer/consumer, Tableflow Iceberg reader, Real-Time Context Engine MCP tools) as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "confluent", "kafka", "tableflow", "iceberg", "flink", "streaming"]

# Runtime deps: lfx (the BUNDLE_API surface) plus the third-party imports the
# components use directly.
#
# * ``confluent-kafka`` powers the Kafka producer/consumer components. It is
#   the vendor-supported client for Confluent Cloud/Platform; its wheels bundle
#   librdkafka so there is no system dependency. The ``avro``/``json``/
#   ``schemaregistry`` extras pull the light Schema Registry (de)serializer
#   deps (fastavro, jsonschema, httpx) so Avro / JSON-Schema topics decode out
#   of the box. It is imported lazily (inside the build methods) so the bundle
#   still loads -- and the MCP / Tableflow components still work -- on a
#   platform where the wheel is unavailable.
# * ``pyiceberg`` + ``pyarrow`` power the Tableflow reader (Iceberg REST
#   catalog -> Arrow -> DataFrame) without a JVM. Also imported lazily.
# * ``langchain-core`` is already an lfx dep but is listed as a direct runtime
#   dep because the MCP preset component types its tools as
#   ``langchain_core.tools.StructuredTool``.
# lfx is floored at the current major.minor line and capped below the next lfx
# major; the floor is re-synced on ``make patch`` via
# scripts/ci/sync_bundle_lfx_pin.py. Fine-grained BUNDLE_API compatibility is
# enforced via extension.json's lfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "lfx>=1.12.0.dev0,<2.0.0",
    "confluent-kafka[avro,json,schemaregistry]>=2.8,<3",
    "pyiceberg>=0.10,<1",
    "pyarrow>=17",
    "langchain-core>=1.2.28,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.langflow.org/extensions"
Repository = "https://github.com/langflow-ai/langflow"

# Manifest-shipping distributions are discovered via the
# ``langflow.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."langflow.extensions"]
lfx-confluent = "lfx_confluent"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the lfx_confluent package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/lfx_confluent"]
include = ["src/lfx_confluent/extension.json", "src/lfx_confluent/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_confluent",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
