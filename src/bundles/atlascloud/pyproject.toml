[project]
name = "lfx-atlascloud"
version = "0.1.0"
description = "Atlas Cloud chat-model component (OpenAI-compatible) as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "atlascloud", "openai", "llm"]

# Runtime deps: lfx (the BUNDLE_API surface) plus the third-party imports the
# bundle's component relies on. Atlas Cloud exposes an OpenAI-compatible API, so
# the chat-model component reuses ``langchain_openai.ChatOpenAI`` and fetches the
# live model list over the Atlas Cloud HTTP API via ``requests``. This mirrors
# the existing OpenAI-compatible provider bundles (novita, cometapi,
# empiriolabs), which declare the same two runtime deps.
# lfx is floored at the current major.minor line and capped below the next lfx
# major; the floor is read from src/lfx/pyproject.toml at port time and
# re-synced on ``make patch`` via scripts/ci/sync_bundle_lfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# lfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "lfx>=1.12.0.dev0,<2.0.0",
    "langchain-openai>=1.1.6",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.langflow.org/extensions"
Repository = "https://github.com/langflow-ai/langflow"

# Manifest-shipping distributions are discovered via the
# ``langflow.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."langflow.extensions"]
lfx-atlascloud = "lfx_atlascloud"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the lfx_atlascloud package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/lfx_atlascloud"]
include = ["src/lfx_atlascloud/extension.json", "src/lfx_atlascloud/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_atlascloud",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
