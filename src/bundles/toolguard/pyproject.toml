[project]
name = "lfx-toolguard"
version = "0.1.2"
description = "Langflow Policies component powered by ToolGuard."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Langflow", email = "contact@langflow.org" },
]
keywords = ["langflow", "lfx", "extension", "policies", "toolguard"]
dependencies = [
    "lfx>=1.12.0.dev0,<2.0.0",
    "toolguard>=0.2.20,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/langflow-ai/langflow"
Documentation = "https://docs.langflow.org/extensions"
Repository = "https://github.com/langflow-ai/langflow"

[project.entry-points."langflow.extensions"]
lfx-toolguard = "lfx_toolguard"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_toolguard"]
include = [
    "src/lfx_toolguard/extension.json",
    "src/lfx_toolguard/components/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_toolguard",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
