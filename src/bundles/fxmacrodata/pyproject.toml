[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "lfx-fxmacrodata"
version = "0.1.0"
description = "Native FXMacroData research integration for Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fxmacrodata-public-client @ https://github.com/fxmacrodata/fxmacrodata-public-client/releases/download/v0.1.0/fxmacrodata_public_client-0.1.0-py3-none-any.whl#sha256=5c60ff217243ff4001f178d4fdd8c3c8ce29001ad1ea0a170ed96606f0dd07c8", "lfx>=1.13.0.dev0,<2.0.0", "langchain-core>=1.2.28,<2"]

[project.urls]
Homepage = "https://fxmacrodata.com"
Documentation = "https://fxmacrodata.com/documentation/reference"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_fxmacrodata"]

[tool.hatch.build.targets.sdist]
include = ["src/lfx_fxmacrodata/**", "README.md", "LICENSE", "pyproject.toml", "examples/**", "tests/**", "CAPABILITIES.md", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[project.entry-points."langflow.extensions"]
lfx-fxmacrodata = "lfx_fxmacrodata"

[tool.hatch.metadata]
allow-direct-references = true
