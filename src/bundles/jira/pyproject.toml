[project]
name = "lfx-jira"
version = "0.1.0"
description = "Jira Cloud issue actions and bounded latest-state polling triggers."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = { text = "MIT" }
dependencies = ["lfx>=1.14.0.dev0,<2.0.0", "httpx>=0.27,<1"]

[project.entry-points."langflow.extensions"]
lfx-jira = "lfx_jira"

[project.entry-points."langflow.trigger_providers"]
jira = "langflow.services.triggers.providers.jira:PROVIDER"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_jira"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
