[project]
name = "lfx-discord"
version = "0.1.0"
description = "Connection-backed Discord bot actions and Gateway triggers for Langflow."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = { text = "MIT" }
dependencies = ["lfx>=1.14.0.dev0,<2.0.0", "httpx>=0.27.0,<1.0.0"]

[project.entry-points."langflow.extensions"]
lfx-discord = "lfx_discord"

[project.entry-points."langflow.trigger_providers"]
discord = "langflow.services.triggers.providers.discord.provider:PROVIDER"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_discord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
