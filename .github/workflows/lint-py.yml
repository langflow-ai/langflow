name: Lint Python

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      branch:
        description: "(Optional) Branch to checkout"
        required: false
        type: string
env:
  POETRY_VERSION: "1.8.2"


jobs:
  lint:
    name: Run Mypy
    runs-on: ubuntu-latest
    # Python 3.15 is a preview lane: it reports ecosystem readiness without failing the run.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      matrix:
        python-version:
          - "3.15"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
    steps:
      - name: Check out the code at a specific ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: true
      - name: "Setup Environment"
        uses: astral-sh/setup-uv@v10.0.0
        with:
          # The uv bundled with this setup-uv only knows CPython 3.15 release candidates;
          # uv 0.13.0 is the first release that installs 3.15.0 final.
          version: ${{ matrix.python-version == '3.15' && '0.13.0' || 'latest-known' }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
          prune-cache: false
      - name: Set up Python preview builds
        if: matrix.python-version == '3.15'
        uses: ./.github/actions/setup-python-preview

      - name: Install the project
        run: uv sync
      - name: Run Mypy
        run: |
          uv run mypy --namespace-packages -p "langflow"
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
