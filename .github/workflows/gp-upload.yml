name: GP Upload Strings

on:
  push:
    branches:
      - "release-*"
    paths:
      - "src/frontend/src/locales/en.json"
      - "src/backend/base/langflow/locales/en.json"
  workflow_dispatch:

jobs:
  upload-frontend:
    runs-on: ubuntu-latest
    name: Upload frontend strings to GP
    environment: GP-test
    # No file-specific gate here: github.event.commits[].modified is unreliable for
    # squash-merge commits (GitHub doesn't consistently populate it for the merge-button
    # commit), which silently skipped this job on nearly every real push. The top-level
    # `on.push.paths` filter already restricts triggering to relevant pushes, computed by
    # GitHub from an actual before/after diff rather than the commit payload, so it's safe
    # to just run whenever the workflow triggers. Upload is idempotent.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check if this is the latest release branch
        id: check-branch
        run: |
          LATEST=$(git ls-remote --heads https://github.com/${{ github.repository }} 'refs/heads/release-*' \
            | awk '{print $2}' \
            | sed 's|refs/heads/||' \
            | grep -E '^release-[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          CURRENT="${{ github.ref_name }}"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping upload — $CURRENT is not the latest release branch ($LATEST)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check-branch.outputs.skip != 'true'
        run: pip install -r scripts/gp/requirements.txt

      - name: Upload strings to GP
        if: steps.check-branch.outputs.skip != 'true'
        working-directory: scripts/gp
        env:
          GP_ADMIN_USER_ID: ${{ secrets.GP_ADMIN_USER_ID }}
          GP_ADMIN_PASSWORD: ${{ secrets.GP_ADMIN_PASSWORD }}
          GP_INSTANCE: ${{ vars.GP_INSTANCE }}
          GP_BUNDLE: ${{ vars.GP_BUNDLE }}
        run: python upload.py --target frontend --source ../../src/frontend/src/locales/en.json

  upload-backend:
    runs-on: ubuntu-latest
    name: Upload backend strings to GP
    environment: GP-test
    # See upload-frontend above for why this no longer checks
    # github.event.commits[].modified. The bot-actor guard stays: it exists to stop the
    # GP Backend Auto-update Strings workflow's own en.json regeneration commits from
    # re-triggering this upload.
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check if this is the latest release branch
        id: check-branch
        run: |
          LATEST=$(git ls-remote --heads https://github.com/${{ github.repository }} 'refs/heads/release-*' \
            | awk '{print $2}' \
            | sed 's|refs/heads/||' \
            | grep -E '^release-[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          CURRENT="${{ github.ref_name }}"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping upload — $CURRENT is not the latest release branch ($LATEST)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check-branch.outputs.skip != 'true'
        run: pip install -r scripts/gp/requirements.txt

      - name: Upload strings to GP
        if: steps.check-branch.outputs.skip != 'true'
        working-directory: scripts/gp
        env:
          GP_ADMIN_USER_ID: ${{ secrets.GP_ADMIN_USER_ID }}
          GP_ADMIN_PASSWORD: ${{ secrets.GP_ADMIN_PASSWORD }}
          GP_INSTANCE: ${{ vars.GP_INSTANCE }}
          GP_BACKEND_BUNDLE: ${{ vars.GP_BACKEND_BUNDLE }}
        run: python upload.py --target backend
