name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "(Optional) ref to checkout"
        required: false
        type: string
  workflow_call:
    inputs:
      python-versions:
        description: "(Optional) Python versions to test"
        required: false
        type: string
        default: "['3.11', '3.12', '3.13', '3.14', '3.15']"
      ref:
        description: "(Optional) ref to checkout"
        required: false
        type: string

env:
  POETRY_VERSION: "1.8.2"

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      max-parallel: 1 # Currently, we can only run at a time for collection-per-db-constraints
      matrix:
        python-version: ${{ fromJson(inputs.python-versions || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_API_ENDPOINT }}
      ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: "Setup Environment"
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: ${{ matrix.python-version == '3.15' && '0.13.0' || 'latest-known' }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
          prune-cache: false
      - name: Set up Python preview builds
        if: matrix.python-version == '3.15'
        uses: ./.github/actions/setup-python-preview

      - name: Run integration tests with api keys
        timeout-minutes: 20
        run: |
          make integration_tests_api_keys
