name: Recover Langflow 1.12.10 numbered manifests
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the four numbered manifests after complete preflight"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: langflow-1.12.10-manifest-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN }}
      - name: Preflight and optionally recover numbered manifests
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          case "${PUBLISH:-false}" in
            true | false) ;;
            *) echo "PUBLISH must be true or false" >&2; exit 1 ;;
          esac
          
          digest() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }
          
          declare -A expected_hub=(
            [1.12.10-amd64]=sha256:b490f1aaf5f79729726c8bf106cb8e4c09c5baafae1f3a9fcffcad039199a6c9
            [1.12.10-arm64]=sha256:bfcc62da42eabe6fee51d3047e9aff09c509509aec83dd3a3fac421a2f8f7a2e
            [base-1.12.10-amd64]=sha256:32c5969b1d370a2ad813138258b14223e0de1af782744236760e4266e8147a25
            [base-1.12.10-arm64]=sha256:2bfa98dd948b11d022d7a6e177eb086655a3ecf3a9bd35884f00f63320a1ea4d
          )
          targets=()
          amd64_sources=()
          arm64_sources=()
          latest_refs=()
          latest_before=()
          
          # Resolve and validate every source before publishing any numbered manifest.
          for repository in docker.io/langflowai/langflow ghcr.io/langflow-ai/langflow; do
            for version in 1.12.10 base-1.12.10; do
              targets+=("${repository}:${version}")
              for arch in amd64 arm64; do
                source_tag="${repository}:${version}-${arch}"
                source_digest="$(digest "$source_tag")"
                [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                if [[ "$repository" == docker.io/* ]]; then
                  [[ "$source_digest" == "${expected_hub[${version}-${arch}]}" ]]
                fi
                source_ref="${repository}@${source_digest}"
                docker buildx imagetools inspect "$source_ref" --format '{{json .Image}}' |
                  jq -e --arg arch "$arch" '.os == "linux" and .architecture == $arch' >/dev/null
                echo "Validated ${source_tag} -> ${source_ref} (linux/${arch})"
                if [[ "$arch" == amd64 ]]; then
                  amd64_sources+=("$source_ref")
                else
                  arm64_sources+=("$source_ref")
                fi
              done
            done
            for tag in latest base-latest; do
              latest_refs+=("${repository}:${tag}")
              latest_before+=("$(digest "${repository}:${tag}")")
              echo "Preserve ${latest_refs[-1]} -> ${latest_before[-1]}"
            done
          done
          
          # Check the preserved tags even if publishing or verification fails partway.
          check_latest() {
            local status=$? current
            trap - EXIT
            for i in "${!latest_refs[@]}"; do
              if current="$(digest "${latest_refs[$i]}")" && [[ "$current" == "${latest_before[$i]}" ]]; then
                echo "Unchanged ${latest_refs[$i]} -> ${current}"
              else
                echo "Latest verification failed: ${latest_refs[$i]}" >&2
                status=1
              fi
            done
            exit "$status"
          }
          trap check_latest EXIT
          
          for i in "${!targets[@]}"; do
            echo "Plan: ${targets[$i]} <- ${amd64_sources[$i]} + ${arm64_sources[$i]}"
          done
          if [[ "${PUBLISH:-false}" != true ]]; then
            echo "Preflight complete. No manifests published."
            exit 0
          fi
          
          for i in "${!targets[@]}"; do
            docker buildx imagetools create --tag "${targets[$i]}" "${amd64_sources[$i]}" "${arm64_sources[$i]}"
            docker buildx imagetools inspect "${targets[$i]}" --raw |
              jq -e --arg amd64 "${amd64_sources[$i]##*@}" --arg arm64 "${arm64_sources[$i]##*@}" '
                (.manifests | map({digest, platform: {os: .platform.os, architecture: .platform.architecture}})
                  | sort_by(.platform.architecture)) ==
                [{digest: $amd64, platform: {os: "linux", architecture: "amd64"}},
                 {digest: $arm64, platform: {os: "linux", architecture: "arm64"}}]
              ' >/dev/null
            echo "Verified numbered manifest: ${targets[$i]} -> $(digest "${targets[$i]}")"
          done
