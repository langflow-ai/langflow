name: Run Frontend Tests

on:
  workflow_call:
    outputs:
      test_status:
        description: >-
          Clean, failed, or skipped Playwright report status. Clean means no
          test ended red; a test that retried to green is logged as flaky but
          does not change this to failed.
        value: ${{ jobs.report-gate.outputs.test_status }}
    secrets:
      OPENAI_API_KEY:
        required: false
      STORE_API_KEY:
        required: false
    inputs:
      suites:
        description: "Test suites to run (JSON array)"
        required: false
        type: string
        default: "[]"
      release:
        description: "Whether this is a release build"
        required: false
        type: boolean
        default: false
      tests_folder:
        description: "(Optional) Tests to run"
        required: false
        type: string
        default: "tests"
      ref:
        description: "(Optional) ref to checkout"
        required: false
        type: string
      runs-on:
        description: "Runner to use for the tests"
        required: false
        type: string
        default: "ubuntu-latest"
      run_live_provider_smoke:
        description: "Run the isolated live-provider smoke suite."
        required: false
        type: boolean
        default: false
      run_live_store_smoke:
        description: "Run Store-backed UI tests without recording artifacts."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      suites:
        description: "Test suites to run (JSON array)"
        required: false
        type: string
        default: "[]"
      release:
        description: "Whether this is a release build"
        required: false
        type: boolean
        default: false
      tests_folder:
        description: "(Optional) Tests to run"
        required: false
        type: string
        default: "tests"
      runs-on:
        description: "Runner to use for the tests"
        required: false
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - self-hosted
          - '["self-hosted", "linux", "ARM64", "langflow-ai-arm64-40gb-ephemeral"]'
        default: ubuntu-latest
      run_live_provider_smoke:
        description: "Run the isolated live-provider smoke suite."
        required: false
        type: boolean
        default: false
      run_live_store_smoke:
        description: "Run Store-backed UI tests without recording artifacts."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  # Where Playwright installs browsers, and what actions/cache archives.
  # Absolute on purpose: a relative value resolves against each step's working
  # directory, so the install (run from src/frontend) wrote to
  # src/frontend/ms-playwright while the cache archived <workspace>/ms-playwright
  # — "Path Validation Error ... no cache is being saved" on every job, so no
  # shard ever hit the cache and all 70 re-downloaded Chromium every run.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
  PLAYWRIGHT_VERSION: "1.60.0"
  LANGFLOW_FEATURE_WXO_DEPLOYMENTS: "true"

jobs:
  determine-test-suite:
    name: Determine Test Suites and Shard Distribution
    runs-on: ${{ (inputs['runs-on'] && startsWith(format('{0}', inputs['runs-on']), '[') && fromJSON(inputs['runs-on'])) || inputs['runs-on'] || github.event.inputs['runs-on'] || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.matrix }}
      shard_count: ${{ steps.setup-matrix.outputs.shard_count }}
      test_grep: ${{ steps.set-matrix.outputs.test_grep }}
      suites: ${{ steps.set-matrix.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/changes-filter.yaml

      - name: Determine Test Suites from Changes
        id: set-matrix
        shell: bash
        env:
          INPUT_SUITES: ${{ inputs.suites }}
          INPUT_RELEASE: ${{ inputs.release }}
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
          COMPONENTS_CHANGED: ${{ steps.filter.outputs.components }}
          STARTER_PROJECTS_CHANGED: ${{ steps.filter.outputs.starter-projects }}
          WORKSPACE_CHANGED: ${{ steps.filter.outputs.workspace }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          DATABASE_CHANGED: ${{ steps.filter.outputs.database }}
        run: |
          set -euo pipefail
          echo "Changes filter output: $FILTER_OUTPUTS"
          SUITES="${INPUT_SUITES:-[]}"
          RELEASE="${INPUT_RELEASE:-false}"

          if ! jq -e '
            type == "array" and
            all(.[];
              type == "string" and
              (. == "components" or . == "starter-projects" or . == "workspace" or
               . == "api" or . == "database" or . == "release")
            )
          ' <<<"$SUITES" >/dev/null; then
            echo "Invalid suites input. Expected a JSON array of supported suite names." >&2
            exit 1
          fi

          declare -a TAGS=()
          if [[ "$RELEASE" == "true" ]]; then
            SUITES='["release"]'
            TAGS=("@release")
          elif [[ "$(jq 'length' <<<"$SUITES")" == "0" ]]; then
            while IFS='|' read -r changed suite tag; do
              if [[ "$changed" == "true" ]]; then
                SUITES=$(jq -c --arg suite "$suite" '. + [$suite]' <<<"$SUITES")
                TAGS+=("$tag")
              fi
            done <<EOF
          $COMPONENTS_CHANGED|components|@components
          $STARTER_PROJECTS_CHANGED|starter-projects|@starter-projects
          $WORKSPACE_CHANGED|workspace|@workspace
          $API_CHANGED|api|@api
          $DATABASE_CHANGED|database|@database
          EOF
            if [[ ${#TAGS[@]} -eq 0 ]]; then
              SUITES='["release"]'
              TAGS=("@release")
              echo "No path-specific changes detected; defaulting to release suite."
            fi
          else
            while IFS= read -r suite; do
              case "$suite" in
                components) TAGS+=("@components") ;;
                starter-projects) TAGS+=("@starter-projects") ;;
                workspace) TAGS+=("@workspace") ;;
                api) TAGS+=("@api") ;;
                database) TAGS+=("@database") ;;
                release) TAGS+=("@release") ;;
              esac
            done < <(jq -r '.[]' <<<"$SUITES")
          fi

          SUITES=$(jq -c '.' <<<"$SUITES")
          TEST_GREP=$(IFS='|'; printf '%s' "${TAGS[*]}")

          echo "Final test suites to run: $SUITES"
          echo "Test grep pattern: $TEST_GREP"
          printf 'matrix=%s\n' "$SUITES" >> "$GITHUB_OUTPUT"
          printf 'test_grep=%s\n' "$TEST_GREP" >> "$GITHUB_OUTPUT"
          printf 'suites=%s\n' "$SUITES" >> "$GITHUB_OUTPUT"

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        id: setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm caching is decoupled from setup-node so a transient cache-service
      # hiccup (frequent on Windows runners) never fails the job. See #25 / #1.
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm dependencies
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ env.NODE_VERSION }}-${{ hashFiles('src/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ env.NODE_VERSION }}-

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./src/frontend

      - name: Validate Playwright CI policies
        run: npm run test:e2e-utilities
        working-directory: ./src/frontend

      - name: Calculate Test Shards Distribution
        id: setup-matrix
        shell: bash
        env:
          TESTS_FOLDER: ${{ inputs.tests_folder }}
          TEST_GREP: ${{ steps.set-matrix.outputs.test_grep }}
        run: |
          set -euo pipefail
          cd src/frontend
          TESTS_FOLDER="${TESTS_FOLDER:-tests}"

          if [[ ! "$TESTS_FOLDER" =~ ^tests(/[A-Za-z0-9._-]+)*$ ]] || [[ "/$TESTS_FOLDER/" == *"/../"* ]]; then
            echo "Invalid tests_folder: $TESTS_FOLDER" >&2
            exit 1
          fi
          command=(npx playwright test "$TESTS_FOLDER")
          [[ -z "$TEST_GREP" ]] || command+=(--grep "$TEST_GREP")
          # `--list` prints a "Listing tests:" header and a "Total: N tests in M
          # files" footer, so `wc -l` over-counts and over-shards.  Parse the
          # footer instead, and treat a zero-match grep as zero tests rather than
          # letting Playwright's non-zero exit kill the step under `set -e`.
          if ! list_output=$("${command[@]}" --list 2>&1); then
            printf '%s\n' "$list_output"
            echo "No tests matched grep='$TEST_GREP' in '$TESTS_FOLDER'; using a single shard."
            TEST_COUNT=0
          else
            printf '%s\n' "$list_output"
            TEST_COUNT=$(printf '%s\n' "$list_output" \
              | sed -n 's/^Total: \([0-9][0-9]*\) test.*/\1/p' | tail -n 1)
            TEST_COUNT=${TEST_COUNT:-0}
          fi

          echo "Total tests to run: $TEST_COUNT"

          # Calculate optimal shard count - 1 shard per 5 tests, min 1, max 70
          SHARD_COUNT=$(( (TEST_COUNT + 4) / 5 ))
          if [ $SHARD_COUNT -lt 1 ]; then
            SHARD_COUNT=1
          elif [ $SHARD_COUNT -gt 70 ]; then
            SHARD_COUNT=70
          fi

          # Create the matrix combinations string
          MATRIX_COMBINATIONS=""
          for i in $(seq 1 $SHARD_COUNT); do
            if [ $i -gt 1 ]; then
              MATRIX_COMBINATIONS="$MATRIX_COMBINATIONS,"
            fi
            MATRIX_COMBINATIONS="$MATRIX_COMBINATIONS{\"shardIndex\": $i, \"shardTotal\": $SHARD_COUNT}"
          done

          echo "matrix={\"include\":[$MATRIX_COMBINATIONS]}" >> "$GITHUB_OUTPUT"
          echo "shard_count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"

  setup-and-test:
    name: Playwright Tests - Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ${{ (inputs['runs-on'] && startsWith(format('{0}', inputs['runs-on']), '[') && fromJSON(inputs['runs-on'])) || inputs['runs-on'] || github.event.inputs['runs-on'] || 'ubuntu-latest' }}
    if: ${{ needs.determine-test-suite.outputs.test_grep != '' }}
    needs: determine-test-suite
    # Without this the job inherits GitHub's 6-hour ceiling: a hung setup step
    # (apt-get in `playwright install --with-deps`) burns six hours and still
    # takes the report gate down with it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-test-suite.outputs.matrix) }}
    continue-on-error: ${{ inputs.runs-on == 'windows-latest' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        id: setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm caching is decoupled from setup-node so a transient cache-service
      # hiccup (frequent on Windows runners) never fails the job. See #25 / #1.
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm dependencies
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ env.NODE_VERSION }}-${{ hashFiles('src/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ env.NODE_VERSION }}-

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./src/frontend

      # Cache Playwright browsers using a composite key
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ runner.os }}
          restore-keys: |
            playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ runner.os }}

      # No `--with-deps` on Linux. On the hosted image every library Chromium
      # links against is already present — the only thing apt installed was 21MB
      # of CJK/X11 font packages, and with every shard missing the cache at once
      # they all pulled them from the same mirror. That is what timed out shard
      # 59 (6h, before the timeout existed) and shard 45 (10m). Fonts affect
      # glyph rendering, not whether Chromium starts, and the cache-hit path has
      # always skipped them anyway.
      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        timeout-minutes: 10
        shell: bash
        working-directory: ./src/frontend
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            echo "Playwright browser install failed (attempt $attempt/3)." >&2
            sleep $(( attempt * 15 ))
          done
          exit 1

      - name: "Setup Environment"
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
          prune-cache: false

      - name: Install Python Dependencies
        run: uv sync --extra audio

      # The backend spawns `uvx --with mcp~=1.28 mcp-proxy ...` for the
      # project MCP server as soon as the UI asks for tool counts
      # (GET /api/v2/mcp/servers?action_count=true). On a cold uv cache that
      # first invocation resolves and downloads mcp-proxy mid-test, which on
      # Windows runners stalls the API for 20-30s until the stdio connect
      # times out. Warm the environment during setup instead. The --with
      # constraint must match mcp_sdk_constraint_args() (lfx.base.mcp.uvx)
      # or uvx builds a different cached environment than the backend uses.
      - name: Pre-warm uvx mcp-proxy (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: uvx --with 'mcp~=1.28' mcp-proxy --help > /dev/null

      - name: Execute Playwright Tests
        timeout-minutes: 18
        shell: bash
        env:
          SERVER_LOG: playwright-server-${{ runner.os }}-${{ matrix.shardIndex }}-${{ github.run_attempt }}.log
          TESTS_FOLDER: ${{ inputs.tests_folder }}
          TEST_GREP: ${{ needs.determine-test-suite.outputs.test_grep }}
        working-directory: ./src/frontend
        run: |
          set -euo pipefail
          TESTS_FOLDER="${TESTS_FOLDER:-tests}"
          if [[ ! "$TESTS_FOLDER" =~ ^tests(/[A-Za-z0-9._-]+)*$ ]] || [[ "/$TESTS_FOLDER/" == *"/../"* ]]; then
            echo "Invalid tests_folder: $TESTS_FOLDER" >&2
            exit 1
          fi
          base_command=(npx playwright test "$TESTS_FOLDER")
          [[ -z "$TEST_GREP" ]] || base_command+=(--grep "$TEST_GREP")
          echo "Running tests with pattern: $TEST_GREP"
          TEST_LIST="$("${base_command[@]}" --shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --list)"
          printf '%s\n' "$TEST_LIST"

          WORKERS=2
          if printf '%s\n' "$TEST_LIST" | grep -Eq 'starter-projects-outdated-components|user-flow-state-cleanup\.spec\.ts|user-progress-track\.spec\.ts|fileUploadComponent\.spec\.ts'; then
            echo "Detected a shared-state or file-upload test; running with one worker."
            WORKERS=1
          fi

          command=("${base_command[@]}" --trace on --shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --workers "$WORKERS" --retries=1)
          printf 'Running:'
          printf ' %q' "${command[@]}"
          printf '\n'
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            DEBUG=pw:webserver "${command[@]}" 2>&1 | tee "$SERVER_LOG"
          else
            "${command[@]}"
          fi

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ runner.os }}-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}-attempt-${{ github.run_attempt }}
          path: src/frontend/blob-report
          retention-days: 1
          overwrite: true

      - name: Upload Playwright Coverage Artifact
        if: always() && hashFiles('src/frontend/coverage/playwright/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-coverage-${{ runner.os }}-${{ matrix.shardIndex }}-attempt-${{ github.run_attempt }}
          path: src/frontend/coverage/playwright
          retention-days: 7
          overwrite: true

      - name: Upload Windows server log
        if: ${{ always() && runner.os == 'Windows' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-server-log-${{ runner.os }}-${{ matrix.shardIndex }}-attempt-${{ github.run_attempt }}
          path: src/frontend/playwright-server-${{ runner.os }}-${{ matrix.shardIndex }}-${{ github.run_attempt }}.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup UV Cache
        run: uv cache prune --ci

  report-gate:
    name: Validate Playwright reports
    needs: [determine-test-suite, setup-and-test]
    runs-on: ${{ (inputs['runs-on'] && startsWith(format('{0}', inputs['runs-on']), '[') && fromJSON(inputs['runs-on'])) || inputs['runs-on'] || github.event.inputs['runs-on'] || 'ubuntu-latest' }}
    if: ${{ always() && needs.determine-test-suite.outputs.test_grep != '' }}
    continue-on-error: ${{ inputs.runs-on == 'windows-latest' }}
    outputs:
      test_status: ${{ steps.validate.outputs.test_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./src/frontend

      # Every attempt is downloaded, not just the current one: "re-run failed
      # jobs" only re-runs the shards that failed, so the shards that passed
      # first time around keep their earlier attempt-N artifact names. Filtering
      # to github.run_attempt would leave the gate permanently short.
      - name: Download blob reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports-raw
          pattern: blob-report-${{ runner.os }}-*-attempt-*

      - name: Check report count, merge, and validate
        id: validate
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_REPORTS: ${{ needs.determine-test-suite.outputs.shard_count }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
        working-directory: ./src/frontend
        run: |
          set -euo pipefail
          raw_dir="$GITHUB_WORKSPACE/all-blob-reports-raw"
          report_dir="$GITHUB_WORKSPACE/all-blob-reports"
          status=failed
          report_json=false
          trap 'echo "test_status=$status" >> "$GITHUB_OUTPUT"; echo "report_json=$report_json" >> "$GITHUB_OUTPUT"' EXIT

          if [[ "${{ steps.download.outcome }}" != "success" ]]; then
            echo "Blob report download failed." >&2
            exit 1
          fi

          if [[ ! "$EXPECTED_REPORTS" =~ ^[0-9]+$ ]] || (( EXPECTED_REPORTS == 0 )); then
            echo "Invalid shard count from determine-test-suite: '$EXPECTED_REPORTS'." >&2
            exit 1
          fi

          # A shard that was re-run has a report under more than one attempt.
          # Build "shard <tab> attempt <tab> path", sort by shard then attempt
          # descending, and keep the first row per shard so the newest attempt
          # wins. Avoids associative arrays, which need bash 4+ (macOS ships 3.2).
          manifest=$(mktemp)
          find "$raw_dir" -type f -name '*.zip' -print | while IFS= read -r zip; do
            artifact=$(basename "$(dirname "$zip")")
            fields=$(printf '%s\n' "$artifact" \
              | sed -nE 's/.*-([0-9]+)-of-[0-9]+-attempt-([0-9]+)$/\1 \2/p')
            if [[ -z "$fields" ]]; then
              echo "Ignoring unrecognized blob report artifact: $artifact" >&2
              continue
            fi
            read -r shard attempt <<<"$fields"
            printf '%s\t%s\t%s\n' "$shard" "$attempt" "$zip"
          done | sort -k1,1n -k2,2nr | awk -F'\t' '!seen[$1]++' > "$manifest"

          actual_reports=$(wc -l < "$manifest" | tr -d ' ')
          missing=$(awk -F'\t' -v total="$EXPECTED_REPORTS" '
            { seen[$1] = 1 }
            END { for (i = 1; i <= total; i++) if (!(i in seen)) printf "%s ", i }
          ' "$manifest")

          if [[ -n "$missing" ]] || [[ "$actual_reports" != "$EXPECTED_REPORTS" ]]; then
            echo "Expected $EXPECTED_REPORTS blob reports; resolved $actual_reports." >&2
            [[ -n "$missing" ]] && echo "Missing shards: $missing" >&2
            find "$raw_dir" -maxdepth 2 -type d -name 'blob-report-*' -print || true
            exit 1
          fi

          rm -rf "$report_dir"
          mkdir -p "$report_dir"
          while IFS=$'\t' read -r shard attempt zip; do
            echo "Shard $shard <- attempt $attempt"
            cp "$zip" "$report_dir/"
          done < "$manifest"

          npx playwright@"${PLAYWRIGHT_VERSION}" merge-reports --reporter json "$report_dir"
          report_json=true
          checker_status=0
          npm run e2e:check-report -- "$PLAYWRIGHT_JSON_OUTPUT_NAME" || checker_status=$?
          npx playwright@"${PLAYWRIGHT_VERSION}" merge-reports --reporter html "$report_dir"
          if [[ "$checker_status" == "0" ]]; then
            status=clean
          fi
          exit "$checker_status"

      - name: Upload merged HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: html-report-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: src/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      # Only meaningful once the merge has run; gating on the step output keeps
      # a short-circuited gate from reporting a second, misleading failure.
      - name: Upload merged JSON report
        if: ${{ always() && steps.validate.outputs.report_json == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: json-report-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playwright-report.json
          if-no-files-found: error
          retention-days: 30

  live-provider-smoke:
    name: Live provider smoke tests
    if: ${{ inputs.run_live_provider_smoke }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LANGFLOW_DEACTIVATE_TRACING: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python environment
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
          prune-cache: false

      - name: Install dependencies
        run: |
          npm ci --prefix src/frontend
          uv sync --extra audio

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./src/frontend

      - name: Run live-provider smoke tests
        timeout-minutes: 20
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test --config=playwright.live.config.ts --workers=1 --retries=0
        working-directory: ./src/frontend

  live-store-smoke:
    name: Live Store UI tests
    if: ${{ inputs.run_live_store_smoke }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python environment
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
          prune-cache: false

      - name: Install dependencies
        run: |
          npm ci --prefix src/frontend
          uv sync --extra audio

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./src/frontend

      - name: Run Store-backed tests without recordings
        timeout-minutes: 30
        env:
          STORE_API_KEY: ${{ secrets.STORE_API_KEY }}
        run: |
          npx playwright test \
            tests/core/features/store-shard-2.spec.ts \
            tests/extended/features/deleteComponents.spec.ts \
            tests/extended/features/deleteFlows.spec.ts \
            tests/extended/regression/generalBugs-shard-13.spec.ts \
            --workers=1 --retries=0 --trace=off --reporter=line
        working-directory: ./src/frontend
