name: Run Frontend Jest Unit Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
    inputs:
      ref:
        description: "(Optional) ref to checkout"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "(Optional) ref to checkout"
        required: false
        type: string

env:
  NODE_VERSION: "22"

jobs:
  jest-unit-tests:
    name: Frontend Jest Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        id: setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Run Frontend Unit Tests
        run: make test_frontend_ci

      - name: Publish Jest Test Results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "src/frontend/test-results/junit.xml"
          check_name: "Frontend Unit Test Results"
          # Fork PR and Dependabot tokens cannot publish check runs. The same
          # action still parses and validates the local JUnit report in this mode.
          annotate_only: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          require_passed_tests: true

      - name: Add Jest Coverage PR Comment
        uses: MishaKav/jest-coverage-comment@v1.0.36
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        with:
          coverage-summary-path: src/frontend/coverage/jest/coverage-summary.json
          title: Frontend Unit Test Coverage Report
          summary-title: Coverage Summary
          badge-title: Coverage
          hide-comment: false
          create-new-comment: false
          hide-summary: false
          junitxml-title: Unit Test Results
          junitxml-path: src/frontend/test-results/junit.xml

      - name: Upload Jest Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jest-test-results
          path: src/frontend/test-results/junit.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload Jest Coverage Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jest-coverage
          path: src/frontend/coverage/jest
          retention-days: 30
