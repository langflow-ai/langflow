name: PR Area Labels

# Applies area:* labels from .github/labeler.yml based on changed paths.
# pull_request_target is used only so fork PRs can be labeled; this workflow
# never checks out or runs PR code, and the labeler config is read from the
# base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
