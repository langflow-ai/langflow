# https://github.com/dorny/paths-filter
python:
  - "src/backend/**"
  - "src/backend/**.py"
  - "src/lfx/**"
  # Provider bundles are first-class Python sources since the metapackage
  # split; without this a bundle-only PR reports python=false and skips the
  # backend suite entirely, including the bundle's own tests.
  - "src/bundles/**"
  - "pyproject.toml"
  - "uv.lock"
  - "src/backend/base/pyproject.toml"
  - "src/lfx/pyproject.toml"
  - "**/python_test.yml"
  - ".github/workflows/ci.yml"
  - "src/lfx/src/lfx/_assets/component_index.json"
components-changes:
  - "src/backend/base/langflow/components/**"
  - "src/lfx/src/lfx/components/**"
  - "src/lfx/src/lfx/_assets/component_index.json"
starter-projects-changes:
  - "src/backend/base/langflow/initial_setup/**"
frontend-tests:
  - "src/frontend/tests/**"
frontend:
  - "src/frontend/**"
  - "**/typescript_test.yml"
  - "**/jest_test.yml"
  - "**/lint-js.yml"
  - ".github/workflows/ci.yml"
  - "src/lfx/src/lfx/_assets/component_index.json"
docs:
  - "docs/**"
docker:
  - "docker/**"
  - "uv.lock"
  - "pyproject.toml"
  - "src/backend/**"
  - "src/frontend/**"
  - "src/lfx/**"
  - ".dockerignore"
  - ".github/workflows/docker-build-v2.yml"
  - ".github/workflows/docker_test.yml"

