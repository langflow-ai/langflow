schema_version: 1
release: 1.11.x

entries:

- id: GH-14334
  title: Docker/Kubernetes startup fails with read-only file system under /opt/app-root/src
  status: resolved
  area: database
  first_bad_version: 1.11.0
  last_known_good_version: 1.10.x
  resolved_in_version: 1.11.2
  fix_pr: https://github.com/langflow-ai/langflow/pull/14354
  workaround: Set LANGFLOW_CONFIG_DIR to a writable path such as /app/langflow, or upgrade to 1.11.2.

- id: GH-14523
  title: The flow editor discards Add Component clicks while the permission check is loading
  status: resolved
  area: flow_editor
  first_bad_version: 1.11.0
  last_known_good_version: 1.10.3
  resolved_in_version: 1.12.0
  fix_pr: https://github.com/langflow-ai/langflow/pull/14523
  workaround: Wait a few seconds after the page loads, then click again.

- id: GH-14227
  title: Backend fails to start in Kubernetes because the mem0 client is imported during startup
  status: resolved
  area: integrations
  first_bad_version: 1.11.0
  last_known_good_version: 1.10.3
  resolved_in_version: 1.11.2
  fix_pr: https://github.com/langflow-ai/langflow/pull/14247
  workaround: none

- id: GH-14455
  title: Saved flows stop running when a built-in component they store drifted from the current one
  status: resolved
  area: components
  first_bad_version: 1.11.1
  last_known_good_version: 1.11.0
  resolved_in_version: 1.12.0
  fix_pr: https://github.com/langflow-ai/langflow/pull/14527
  workaround: Open each affected flow and update the drifted component so its stored code matches the built-in one.

