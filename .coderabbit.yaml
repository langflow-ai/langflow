language: en-US
tone_instructions: ""
early_access: true
enable_free_tier: true
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: Use conventional commits structure
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false
  labeling_instructions: []
  # Generated files: reviewing them spends the per-review file budget on machine output.
  path_filters:
    - "!**/starter_projects/*.json"
    - "!src/lfx/src/lfx/_assets/**"
    - "!**/locales/*.json"
    - "!.secrets.baseline"
    - "!scripts/ci/bundle_profile_locks/**"
    - "!**/package-lock.json"
  # Each rule targets bug classes that recurred in fix PRs and regressions (regressions/*.yaml)
  # into main and release-*. Every rule whose glob matches a file applies to it. Helper names
  # are the canonical ones current code uses; keep them in sync when those modules change.
  path_instructions:
    - path: "{src/backend/base/langflow,src/lfx/src,src/bundles/*/src}/**/*.py"
      instructions: |
        Flag these security mistakes:
        - Outbound HTTP to a URL from user input, a flow field or a component field that bypasses the SSRF layer:
          `lfx.utils.ssrf_protection.validate_and_resolve_url` with pinned IPs or
          `lfx.utils.ssrf_transport.SSRFProtectedTransport`; `lfx.utils.ssrf_httpx`
          (`ssrf_protected_httpx_client_kwargs_for_url`, `validate_url_for_ssrf_or_raise`) for SDK clients;
          `lfx.utils.ssrf_requests.ssrf_safe_get` for `requests`; `lfx.base.models.provider_ssrf` for provider
          base URLs; `enforce_kb_destination` for knowledge-base destinations. Redirects must be re-validated on
          every hop. Don't flag URLs that come from deployment settings or operator environment variables.
        - Local paths from user input that bypass `enforce_local_file_access(path, scope_ids=component_file_access_scopes(self))`,
          or storage keys that bypass `validate_storage_key(self, path)` (both in `lfx.utils.file_path_security`).
          Flag a missing `scope_ids`, and filenames used without rejecting control characters or normalizing Unicode.
        - `os.getenv` or `os.environ` lookups whose variable name comes from a flow field, tweak or request instead
          of `lfx.utils.env_var_security.safe_getenv`. Fixed, code-chosen names are fine, and the
          global-variable-to-environment fallback is intentional.
        - URLs, tokens or credentials in logs, error messages, API responses or trace spans without
          `lfx.utils.url_redaction` (`sanitize_url_for_display`, `redact_urls_in_text`), and user-submitted
          request values echoed into logs (for example, validation errors that include the request body).
        - User-controlled values reaching subprocess arguments, MCP stdio commands or interpreter options.
          Code-execution features (Python REPL, jq, mustache, custom components) must go through
          `lfx.utils.python_repl_security`, `jq_security`, `mustache_security` and the custom-component policy;
          flag only paths that bypass them.
        - Security or permission checks that allow the request when the check errors, or when the owner or
          permission data is missing (for example, an owner of None). They must fail closed. The OSS
          pass-through authorization service is allow-all by design; flag only a registered plugin path or a guard
          that swallows its own error.
        - A new restriction that breaks a documented allowlist: every `LANGFLOW_SSRF_ALLOWED_HOSTS` form
          (hostname, wildcard, CIDR, IP literal) and other allowlist settings must keep working, with a test for
          the permitted case.
        Flag a swallowed exception only where it affects correctness: a security or permission check, a data write,
        or a success response after a failed operation. Don't flag `except Exception` that carries a
        `noqa: BLE001` reason such as best-effort audit, telemetry, cleanup or optional imports.
    - path: "{src/lfx/src/lfx/components,src/bundles/*/src}/**/*.py"
      instructions: |
        Review the component's runtime behavior, not only its style. Flag:
        - Input handling bugs: numeric vs. string values, lists vs. scalars, empty, None and missing values, and
          defaults that differ between UI, API and tool-mode callers.
        - Tool-mode arguments that silently override or drop values configured on the component, or the reverse.
        - `getattr(self, name)` where `name` comes from an external schema (MCP tool arguments, tool-call payloads);
          it can return a method or class attribute. Read the component's inputs instead.
        - `isinstance` checks against a concrete class that guard cleanup, statistics or teardown; they skip
          silently when the object is a proxy or wrapper. Check the interface instead.
        - Side effects (ingestion, writes, external calls) that can run more than once per execution, or leave
          inconsistent state when a run is cancelled or fails partway.
        - Outputs that don't return their declared types on every path, including errors.
        The component compatibility gate reports removed or narrowed inputs and outputs of in-tree lfx
        components, so don't repeat it. For components under `src/bundles`, flag a renamed or removed component
        class, `name`, input or output. Deprecating with `legacy = True` and `replacement = [...]` is the
        intended path; don't flag it.
    - path: "src/lfx/src/lfx/base/{agents,chains,composio,compressors,data,datastax,document_transformers,embeddings,flow_controls,flow_processing,huggingface,io,langchain_utilities,memory,models,processing,prompts,textsplitters,tools,vectorstores}/**/*.py"
      instructions: |
        These are component base classes, so a change here changes every subclass. Flag changes to inputs,
        outputs, output types or output methods that subclasses inherit, and check the subclasses that override
        the changed behavior.
    - path: "src/backend/base/langflow/api/**/*.py"
      instructions: |
        Flag:
        - A route that fetches a user-owned resource by id with neither an owner filter
          (`Model.user_id == current_user.id`) nor a guard: an `ensure_*_permission` guard from
          `langflow.services.authorization.guards`, a dependency from `api/v1/authz_route_dependencies.py`, or
          `authorized_or_owner_scoped` from `langflow.services.authorization.fetch`. In OSS the guards are
          pass-through, so check owner scoping first. Don't flag superuser-only routes or routes that use
          `ensure_administration_permission`.
        - A guard denial that returns 403 to a caller who can't read the resource; use `deny_to_404` so its
          existence isn't revealed. A caller who can read it should get 403 via `deny_to_404_unless_readable`.
        - List endpoints that don't scope results with `filter_visible_resources` or the
          `restrict_to_owned_or_visible*` / `apply_owned_or_visible*_prefilter` helpers in
          `langflow.services.authorization.listing`. Other users' personal projects, and resources inside them,
          must not appear.
        - Execution entry points (run, webhook, chat, MCP, A2A, voice, workflow v2, triggers) that don't stamp the
          graph with `stamp_execution_principal(graph, execution_principal_for(...))` from
          `langflow.api.utils.execution_principal`; a new entry point must also be listed in
          `scripts/ci/execution_principal_matrix.json`. Public or anonymous paths must keep
          `validate_catalog_policy_for_flow`, `validate_public_flow_no_code_execution` and
          `prepare_public_flow_build` from `lfx.utils.flow_validation`.
        - Chat history, session and message reads or writes keyed by session name alone instead of flow and owner.
        - A pagination `limit` without a maximum, or an unbounded request body. When a list endpoint gains or
          lowers a cap or changes sort order, check `src/frontend` consumers that assume the full list or
          oldest-first order.
        - A database session (`DbSession`, `session_scope`) held open across a websocket or stream lifetime, or
          across an await on network or other external I/O; release it first.
    - path: "src/lfx/src/lfx/base/mcp/**"
      instructions: |
        Flag:
        - Sessions or subprocesses not closed on every error and cancellation path, and session reference counts
          that don't balance on normal disconnect and re-acquire.
        - A pooled session reused after its server died instead of being replaced.
        - A `call_tool` retried after a timeout; the server may already have run it. Other retries need a bound
          and a timeout.
        - Stdio configs that skip `validate_mcp_stdio_config` (`security.py`) or `validate_mcp_stdio_source_policy`
          (`source_policy.py`). A validator that returns early when a hardening flag is off must still reject
          interpreter options such as `node --import` and shell-expansion characters.
    - path: "src/backend/base/langflow/api/v1/{mcp,mcp_projects,mcp_utils,agentic_mcp,projects_mcp_helpers}.py"
      instructions: |
        Flag:
        - MCP server names derived from user text without a Unicode-safe, collision-free mapping.
        - Auto-registration that isn't idempotent across restarts, or that mints an API key without removing
          the previous one.
        - Tool input schemas that ignore the API-exposure and allowlist settings, or are derived by running stored
          component code.
        - Management responses that echo server credentials or headers, and a missing server that returns 500
          instead of 404.
    - path: "{src/lfx/src/lfx/graph,src/lfx/src/lfx/components/flow_controls,src/lfx/src/lfx/base/flow_controls}/**/*.py"
      instructions: |
        Flag:
        - Changes that can run an inactive or unselected branch, or skip an active one. Check loop,
          conditional-router and `stop()` semantics, including inside grouped components and fan-out.
        - Checkpoint or human-in-the-loop resume that doesn't restore state such as `user_id`, vertex scheduling
          and model state exactly once.
        - Result caches, such as the frozen-vertex cache, that aren't scoped to the executing user.
    - path: "src/frontend/src/**/*.{ts,tsx}"
      instructions: |
        Skip tests and `icons/`. Flag:
        - Mutations that don't invalidate or update the React Query cache entries that display the changed data.
        - Zustand store updates that overwrite a concurrent edit (for example, autosave racing a node update), or
          that discard a whole server response when only part of it is stale.
        - State keyed by session, flow or user that can leak into another session, flow or user.
        - Click or submit handlers that silently do nothing while data or permissions load; disable the control
          or queue the action instead.
        - Effects that start polling, timers or subscriptions without cleaning them up.
        Don't comment on styling or naming.
    - path: "src/backend/base/langflow/services/**/*.py"
      instructions: |
        Flag:
        - Cleanup registered after the resource it cleans up has started.
        - Optional integrations (tracers, plugins) initialized in one `try` block, so one failure skips the rest.
          Each needs its own guard and a failure logged at a visible level.
        - Leases, locks or claims not released on every error path, and ordering assumptions between concurrent
          workers.
        - Background retries without a bound.
        - A database session held open across awaits on network or other external I/O.
    - path: "src/backend/base/langflow/{main.py,initial_setup/*.py,services/settings/**/*.py,services/database/**/*.py}"
      instructions: |
        Startup and upgrade failures are the most common recorded regressions. Flag:
        - Startup code that needs a writable path, makes network calls or imports optional SDKs at import time.
        - Code that assumes rows, flows or settings written by an older version have the current shape.
        - Deletes that cascade differently on PostgreSQL and SQLite.
        - A new or changed setting without a safe default, or one that only works when an environment variable
          is set.
    - path: "src/backend/base/langflow/alembic/versions/*.py"
      instructions: |
        Migrations declare `Phase: EXPAND`, `MIGRATE` or `CONTRACT` (see `alembic/DB-MIGRATION-GUIDE.MD`). Dropping
        columns or narrowing types is acceptable only in a CONTRACT migration; EXPAND changes must be additive and
        nullable. Check idempotency (existence checks before create or drop), SQLite and PostgreSQL parity,
        timezone-aware datetimes, and backfills that identify rows by mutable values such as names. Merge-head
        migrations with empty bodies are fine. Don't repeat what the `validate-migrations` hook checks.
    - path: "{pyproject.toml,src/**/pyproject.toml}"
      instructions: |
        Flag:
        - Lower-bound-only ranges on ORM, schema, serialization or protocol SDKs (sqlmodel, sqlalchemy, alembic,
          pydantic, mcp). Bound the next major version.
        - A bump that changes inferred column types without a migration in the same PR.
        - Changes to extras or bundle membership, and changes that break resolution on Python 3.10–3.14.
    - path: ".github/workflows/*.{yml,yaml}"
      instructions: |
        Flag `pull_request_target` jobs that check out or run PR head code, untrusted `${{ github.event.* }}`
        values interpolated directly into `run:` scripts, and permissions broader than the job needs.
    - path: "{**/tests/**,**/__tests__/**,**/*.test.{ts,tsx},**/*.spec.ts}"
      instructions: |
        Only comment when a test cannot fail for the bug it claims to cover, leaks state into other tests, or
        depends on the network or wall-clock time. Coverage is handled by the pre-merge check; don't repeat it
        inline. Mocking isn't a defect by itself; flag it only when the mock replaces the behavior under test.
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: false
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches:
      - "release-.*"
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Test Coverage for New Implementations"
        instructions: |
          Check if the PR includes new or updated test files that correspond to the code changes:
          1. For new components or functionality, ensure corresponding tests are included in the PR
          2. For bug fixes, verify that regression tests are included
          3. For new features, ensure both unit and integration tests are present where appropriate
          4. Check that test files follow the project's naming conventions (test_*.py for backend; *.test.ts(x) or *.spec.ts(x) under src/frontend/src for Jest unit tests; *.spec.ts under src/frontend/tests for Playwright end-to-end tests)
          5. Verify that tests actually test the new functionality, not just placeholder tests or smoke tests
          6. For async code, check that tests use proper async patterns (pytest-asyncio for backend)
        mode: "warning"
  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    golangci-lint:
      enabled: false
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    detekt:
      enabled: false
    eslint:
      enabled: false
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    actionlint:
      enabled: true
    pmd:
      enabled: false
    cppcheck:
      enabled: false
    semgrep:
      enabled: true
    circleci:
      enabled: false
    clippy:
      enabled: false
    sqlfluff:
      enabled: false
    prismaLint:
      enabled: false
    pylint:
      enabled: false
    oxc:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    brakeman:
      enabled: false
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    checkmake:
      enabled: true
chat:
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto
knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions:
      - path: src/backend/tests/**/*.py
        instructions: We already have a client fixture and use pytest
      - path: src/frontend/tests/**/*.ts
        instructions: We use Playwright
      - path: src/frontend/src/**/*.test.ts
        instructions: We use Jest and React Testing Library for unit tests
      - path: src/frontend/src/**/*.test.tsx
        instructions: We use Jest and React Testing Library for unit tests
